volumes:
    data:
    keymap:
services:

    saltiniai-database:
        image: postgis/postgis:16-3.4
        environment:
            POSTGRES_USER: django
            POSTGRES_PASSWORD: django
        volumes:
            - "data:/var/lib/postgresql/data"
        ports:
            - "9432:5432"

    django:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ".:/app"
        command: ./entrypoint.sh
        ports:
            - "8000:8000"
        environment:
            DJANGO_SUPERUSER_EMAIL: test@test.com
            DJANGO_SUPERUSER_PASSWORD: test
            DJANGO_SETTINGS_MODULE: conf.settings_test
            DB_NAME: django
            DB_USER: django
            DB_PASSWORD: django
            DB_HOST: saltiniai-database
            DB_PORT: 5432
            RUN_MODE: "DEVELOPMENT"
        depends_on:
            - saltiniai-database

    redis:
      image: valkey/valkey:9
      restart: always
      command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
      ports:
        - "6379:6379"
      volumes:
        - keymap:/data

    spinta:
      image: vssadevops/spinta:latest
      environment:
        - HOME=/app/spinta_config
        - SPINTA_CONFIG=/app/spinta_config/config.yml
        - SPINTA_AUTO_UPGRADE=true
        - _TYPER_STANDARD_TRACEBACK=1
      ports:
        - "8080:8000"
      volumes:
        - ./spinta:/app/spinta_config
        - ./manifest:/app/manifest
      depends_on:
        - saltiniai-database
        - django
